<!DOCTYPE html>
<html data-offline-build="v1" lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="description" content="浮光 · 一周重排 —— 离线可读版。无需登录、无需联网，双击即可打开完整交互页面。">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FBF5E6'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FF82A2'/%3E%3C/svg%3E">

<meta content="width=device-width,initial-scale=1" name="viewport">
<title>浮光 · 一周重排 · 可交互网页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* 青提芭乐 · 严格取自参考图，不自行造色 */
  --paper:#FBF5E6;      /* 纸：暖米 */
  --paper2:#F5ECD7;     /* 老纸 */
  --card:#FBF5E6;       /* 卡面：纸（比老纸底子亮一档，靠描边+投影分开） */
  --ink:#4F2028;        /* 墨：深酒红（文字主色） */
  --ink2:#7A4A50;       /* 次墨 */
  --ink3:#B58A8E;       /* 弱墨 */
  --line:#E7DEC4;       /* 线 */
  --pink:#FED0D6;       /* 芭乐浅粉（容器/我泡） */
  --hot:#FF82A2;        /* 热粉（状态/选中） */
  --hotd:#CC3A62;       /* 热粉压深（白字过 AA 4.59:1） */
  --lime:#E4F6A9;       /* 青柠（动作/青提） */
  --limed:#8FA83C;      /* 青柠深 */
  --sage:#BDDE93;       /* 鼠尾草（已生效） */
  --saged:#4F6B33;      /* 鼠尾草深 */
  --ai:#DBE2C5;         /* AI 泡（青提绿调） */
  --meb:#FFD4DD;        /* 我泡（芭乐粉调） */
  --shadow:0 10px 24px -14px rgba(79,32,40,.55);
}
html,body{height:100%}
/* 底色：护眼黄（老纸）方格纸 —— 参考图的淡蓝格换成暖黄，色仍取自青提芭乐 */
html{background:var(--paper2)}
/* 方格纸铺满整个视口，任何尺寸都不露底 */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    linear-gradient(0deg,rgba(79,32,40,.085) 1px,transparent 1px) 0 0/100% 20px,
    linear-gradient(90deg,rgba(79,32,40,.085) 1px,transparent 1px) 0 0/20px 100%,
    linear-gradient(0deg,rgba(79,32,40,.10) 1px,transparent 1px) 0 0/100% 100px,
    linear-gradient(90deg,rgba(79,32,40,.10) 1px,transparent 1px) 0 0/100px 100%
}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
.app{
  height:100vh;display:grid;
  grid-template-columns:300px minmax(0,1fr) 300px;
  gap:0;align-items:center;justify-content:center;
  padding:24px 30px;
}

/* ══════════ 左栏 ══════════ */
.rail{display:flex;flex-direction:column;height:min(844px,calc(100vh - 48px));padding-right:6px}
.brand{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.18em;color:var(--ink3);font-weight:700}
.brand i{width:7px;height:7px;border-radius:50%;background:var(--hot);display:block}
.rail h1{font-size:27px;line-height:1.34;font-weight:800;letter-spacing:-.4px;margin-top:14px}
.rail h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--lime) 62%,var(--lime) 92%,transparent 92%)}
.rail .sub{margin-top:11px;font-size:12px;line-height:1.85;color:var(--ink2)}
.beats{margin-top:22px;list-style:none;position:relative;overflow:auto;scrollbar-width:none;flex:1;padding-right:2px}
.beats::-webkit-scrollbar{display:none}
.beats::before{content:"";position:absolute;left:13px;top:14px;bottom:18px;width:1.5px;background:repeating-linear-gradient(180deg,rgba(74,34,51,.18) 0 5px,transparent 5px 9px)}
.beat{position:relative;display:flex;gap:11px;padding:8px 4px;cursor:pointer;border-radius:10px;transition:.14s;align-items:flex-start}
.beat:hover{background:rgba(251,245,230,.55)}
.beat .dot{
  width:27px;height:27px;border-radius:50%;flex:none;position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;
  background:var(--paper);border:1.5px solid rgba(74,34,51,.26);
  font-size:10px;font-weight:800;color:var(--ink3);transition:.16s
}
.beat.on .dot{background:var(--ink);border-color:var(--ink);color:var(--lime);transform:scale(1.06)}
.beat.done .dot{background:var(--sage);border-color:var(--sage);color:#2F4118}
.beat .bt{font-size:12.5px;font-weight:700;line-height:1.45;padding-top:3px}
.beat .bw{font-size:9.5px;color:var(--ink3);margin-top:2px;padding-top:1px}
.beat.on .bt{color:var(--ink)}
.beat:not(.on):not(.done) .bt{color:var(--ink2)}

.railfoot{flex:none;padding-top:8px;display:flex;align-items:flex-end;gap:10px}
.railfoot .cat{flex:none}
.railfoot .cat img,.railfoot .cat svg{display:block;width:84px;height:84px;object-fit:contain}
.railfoot p{font-size:10.5px;line-height:1.6;color:var(--ink3);padding-bottom:5px}
.railfoot b{color:var(--ink2)}

/* ══════════ 手机 ══════════ */
.stagewrap{display:flex;align-items:center;justify-content:center;height:100%}
.fit{transform-origin:top left;position:relative}
.fit .phone{position:absolute;left:0;top:0}
.phone{
  width:390px;height:844px;background:#3A2430;border-radius:46px;
  padding:9px;box-shadow:0 34px 60px -34px rgba(58,36,48,.7),0 0 0 1.5px rgba(58,36,48,.5),inset 0 0 0 1px rgba(255,255,255,.14);
  display:flex;flex-direction:column;position:relative
}
.screenbox{
  flex:1;background:var(--paper2);border-radius:38px;overflow:hidden;
  display:flex;flex-direction:column;position:relative;
  background-image:linear-gradient(0deg,rgba(79,32,40,.075) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(79,32,40,.075) 1px,transparent 1px),
                   linear-gradient(0deg,rgba(79,32,40,.09) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(79,32,40,.09) 1px,transparent 1px);
  background-size:100% 20px,20px 100%,100% 100px,100px 100%
}
.statusbar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex:none;font-size:11px;font-weight:700;color:var(--ink)}
.statusbar .dots{display:flex;gap:3px;align-items:center}
.statusbar .dots i{width:3px;height:3px;background:var(--ink);border-radius:50%;display:block}
.statusbar .batt{width:17px;height:8px;border:1.4px solid var(--ink);border-radius:2.5px;position:relative}
.statusbar .batt::after{content:"";position:absolute;left:1.2px;top:1.2px;bottom:1.2px;width:9px;background:var(--ink);border-radius:1px}
.topbar{
  flex:none;display:flex;align-items:center;gap:9px;padding:5px 14px 8px;
  border-bottom:1.5px dashed rgba(74,34,51,.14)
}
.topbar .bk{font-size:15px;color:var(--ink2);width:16px;display:none}
.topbar .who{display:flex;flex-direction:column;line-height:1.35}
.topbar .who b{font-size:14px;font-weight:800;letter-spacing:.01em}
.topbar .who span{font-size:9.5px;color:var(--ink3);margin-top:1px}
.topbar .avatar{width:34px;height:34px;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center;margin-left:auto;box-shadow:inset 0 0 0 1.5px rgba(74,34,51,.12);overflow:hidden;flex:none}
.topbar .avatar{font-size:12.5px;font-weight:800;color:#7A2E42;box-shadow:inset 0 0 0 1.5px rgba(74,34,51,.12)}
.topbar .avatar img,.topbar .avatar svg{width:27px;height:27px;display:block;object-fit:contain}
.topbar .goal{font-size:9px;font-weight:800;color:var(--saged);background:var(--lime);border-radius:20px;padding:3px 8px;letter-spacing:.02em}

.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 14px 26px;scrollbar-width:none;position:relative}
.screen::-webkit-scrollbar{display:none}

/* 气泡 */
.msg{display:flex;gap:8px;margin-bottom:10px;align-items:flex-start}
.msg.me{justify-content:flex-end}
.msg .av{width:32px;height:32px;flex:none;margin-top:1px}
.msg .av img,.msg .av svg{display:block;width:32px;height:32px;object-fit:contain}
.bub{
  max-width:270px;font-size:13px;line-height:1.72;padding:11px 14px;
  background:var(--ai);border-radius:16px;border-bottom-left-radius:5px;
  border:1.6px solid #B5BB9F;
  box-shadow:0 3px 0 rgba(181,187,159,.45),0 8px 16px -12px rgba(79,32,40,.5);
  position:relative;
}
.bub::after{
  content:"";position:absolute;left:-6px;bottom:2px;width:0;height:0;
  border-top:7px solid transparent;border-right:8px solid var(--ai);border-bottom:7px solid transparent
}
.bub b{font-weight:800}
.bub.me{
  background:var(--meb);border-radius:16px;border-bottom-right-radius:5px;max-width:250px;
  border-color:#D5ABB3;box-shadow:0 3px 0 rgba(213,171,179,.45),0 8px 16px -12px rgba(79,32,40,.5)
}
.bub.me::after{
  left:auto;right:-6px;border-right:none;
  border-left:8px solid var(--meb)
}
.bub .hl{background:linear-gradient(transparent 58%,var(--lime) 58%);font-weight:800}
.bub .num{font-weight:800;color:var(--hotd)}
.stamp{text-align:center;font-size:9.5px;color:var(--ink3);margin:6px 0 12px;letter-spacing:.04em}

/* 回执条 */
.receipt{
  display:flex;align-items:center;gap:8px;font-size:9.5px;color:var(--ink3);
  padding:7px 11px;margin-bottom:12px;border:1.2px dashed rgba(74,34,51,.16);border-radius:10px;
  background:rgba(251,245,230,.6);cursor:pointer;transition:.14s
}
.receipt:hover{background:rgba(251,245,230,.98);border-color:rgba(74,34,51,.28)}
.receipt .ok{width:14px;height:14px;border-radius:50%;background:var(--sage);color:#2F4118;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex:none}
.receipt .ar{margin-left:auto;font-size:10px;color:var(--ink3)}

/* ══════════ 卡片 ══════════ */
.card{
  background:var(--paper);border-radius:16px;padding:14px 14px 13px;margin-bottom:11px;position:relative;
  box-shadow:0 3px 0 rgba(79,32,40,.20),0 26px 36px -22px rgba(79,32,40,.72);
  border:1.7px solid rgba(79,32,40,.26)
}
.card-h{display:flex;align-items:baseline;gap:8px;padding-bottom:9px;border-bottom:1.5px dashed rgba(74,34,51,.14)}
.card-h b{font-size:13.5px;font-weight:800;letter-spacing:-.1px}
.card-h span{font-size:9px;color:var(--ink3);margin-left:auto;white-space:nowrap}
.card-corner{position:absolute;right:9px;top:-17px;width:44px;height:44px;color:var(--ink);transform:rotate(-6deg)}
.card-corner svg{width:44px;height:44px;display:block}

/* ── 票根：每一条是一张可撕下的联 ──
   打孔虚线整条拉通到卡片左右边沿，两端用底色画半圆，把卡片边框「咬」出一个缺口 */
.row{
  position:relative;display:flex;gap:10px;padding:13px 0 12px;
  align-items:center;cursor:pointer;transition:.16s
}
.row + .row::before,.card-f::before{
  content:"";position:absolute;left:-16px;right:-16px;top:0;height:0;pointer-events:none;
  border-top:1.6px dashed rgba(74,34,51,.26)
}
.row + .row::after,.card-f::after{
  content:"";position:absolute;left:-24px;right:-24px;top:-7px;height:16px;pointer-events:none;
  background:
    /* 洞口边缘那圈浅影，让洞看起来有厚度 */
    radial-gradient(circle 8px at 8px 8px,transparent 7px,rgba(79,32,40,.13) 7.5px,transparent 8px),
    radial-gradient(circle 8px at calc(100% - 8px) 8px,transparent 7px,rgba(79,32,40,.13) 7.5px,transparent 8px),
    /* 洞本身：比卡面暗一档，和卡片投在外面的影子接得上 */
    radial-gradient(circle 8px at 8px 8px,color-mix(in srgb,var(--paper2) 84%,var(--ink) 16%) 7.3px,transparent 8px),
    radial-gradient(circle 8px at calc(100% - 8px) 8px,color-mix(in srgb,var(--paper2) 84%,var(--ink) 16%) 7.3px,transparent 8px)
}
.row .n{
  width:20px;height:20px;border-radius:7px;flex:none;
  display:flex;align-items:center;justify-content:center;background:var(--lime);
  font-size:10px;font-weight:800;color:#3A4A12
}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:13px;font-weight:800;line-height:1.34}
.row .t span{display:block;font-size:10.5px;line-height:1.55;color:var(--ink2);margin-top:3px}
/* 时间流转：原时段 → 新时段，用胶囊把时间拎出来 */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:5px}
.row .t .flow .fb{
  font-size:10px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.2px;
  padding:3px 6px;border-radius:7px;background:var(--lime);color:#33420F;
  box-shadow:inset 0 0 0 1.2px rgba(79,32,40,.14);white-space:nowrap
}
.row .t .flow .fp{font-size:11px;font-weight:800;color:var(--hotd);font-style:normal}
/* 采纳：手指够得着的实体按钮，热粉底 + 深墨字 */
.row .k{
  flex:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;
  min-height:38px;min-width:66px;padding:0 12px;border-radius:12px;
  font-size:11.5px;font-weight:800;letter-spacing:.02em;
  background:var(--hot);color:#4A1A26;box-shadow:0 2.5px 0 #D4647F;white-space:nowrap;transition:.14s
}
.row .k::after{content:"✓";font-size:12.5px;font-weight:800;line-height:1}
.row:active .k{transform:translateY(1px);box-shadow:0 1px 0 #D4647F}
.row.off .n{background:rgba(79,32,40,.09);color:var(--ink3)}
.row.off .t b{color:var(--ink3);text-decoration:line-through;text-decoration-thickness:1.4px}
.row.off .t span{opacity:.45}
.row.off .k{background:transparent;color:var(--ink2);box-shadow:inset 0 0 0 1.5px rgba(79,32,40,.24)}
.row.off .k::after{content:"↺";font-size:11px}
.row.off{
  opacity:.72;border-radius:12px;background:rgba(245,236,215,.72);
  /* 撕下来的那一联：只剩这一块浅坑，不再另画虚线，免得和打孔线撞在一起 */
  box-shadow:inset 0 0 0 1px rgba(79,32,40,.07)
}

.card-f{position:relative;display:flex;align-items:center;gap:10px;padding-top:13px;margin-top:1px}
.cnt{font-size:9.5px;color:var(--ink3);white-space:nowrap;margin-right:auto}
.cnt b{font-size:13px;color:var(--ink);font-weight:800}
.btns{display:flex;gap:7px;flex:none}
.btn{
  font-family:inherit;border:0;cursor:pointer;font-size:12px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:40px;
  padding:0 15px;border-radius:11px;background:var(--lime);color:#33420F;
  box-shadow:0 2.5px 0 #94A94A;transition:.1s;letter-spacing:.01em;white-space:nowrap
}
.btn:active{transform:translateY(2px);box-shadow:0 0.5px 0 #94A94A}
.btn.ghost{background:transparent;color:var(--ink2);box-shadow:inset 0 0 0 1.4px rgba(74,34,51,.2)}
.btn.ghost:active{transform:translateY(1px)}
.btn.ink{background:var(--ink);color:var(--lime);box-shadow:0 2.5px 0 #2A1220}
.btn:disabled{background:rgba(74,34,51,.08);color:var(--ink3);box-shadow:none;cursor:not-allowed}
.btn.sm{font-size:10px;padding:7px 11px}

/* 自定义 chips */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chips .ch{
  font-size:10px;font-weight:700;padding:5px 10px;border-radius:20px;cursor:pointer;
  background:var(--paper);color:var(--ink2);box-shadow:inset 0 0 0 1.4px rgba(79,32,40,.3);
  transition:.14s
}
.chips .ch:hover{box-shadow:inset 0 0 0 1.4px rgba(79,32,40,.5)}
.chips .ch.on{background:var(--hotd);color:#fff;box-shadow:none}

/* ══════════ 单日时间轴 ══════════ */
.weekhead{display:flex;align-items:baseline;gap:8px;margin:2px 0 9px}
.weekhead b{font-size:14px;font-weight:800}
.weekhead span{font-size:9.5px;color:var(--ink3);margin-left:auto}
.daybar{display:flex;gap:5px;overflow-x:auto;padding:1px 0 3px;scrollbar-width:none;margin-bottom:10px}
.daybar::-webkit-scrollbar{display:none}
.dchip{
  flex:none;min-width:38px;border-radius:10px;padding:6px 5px 5px;text-align:center;cursor:pointer;
  background:rgba(251,245,230,.75);box-shadow:inset 0 0 0 1.3px rgba(74,34,51,.14);position:relative;transition:.14s
}
.dchip .d1{font-size:9.5px;font-weight:700;color:var(--ink2)}
.dchip .d2{font-size:8.5px;color:var(--ink3);margin-top:1px}
.dchip.on{background:var(--ink);box-shadow:none}
.dchip.on .d1{color:#FBF5E6}
.dchip.on .d2{color:#C9B3B6}
.dchip i{position:absolute;top:3px;right:4px;width:4px;height:4px;border-radius:50%;background:var(--hot);display:block}
.dchip i.g{background:var(--sage)}
.dchip i.b{background:var(--hotd)}

/* 时间轴：半小时 = 20px 一格，内部可上下滑 */
.tl{
  position:relative;height:322px;border-radius:14px;overflow-y:auto;overflow-x:hidden;
  background:var(--paper);box-shadow:inset 0 0 0 1.6px rgba(79,32,40,.2);
  scrollbar-width:none;-webkit-overflow-scrolling:touch
}
.tl::-webkit-scrollbar{display:none}
.tlwrap{position:relative}
/* 下方还有内容时给一点渐隐，别让块被硬切一刀 */
.tlwrap::after{
  content:"";position:absolute;left:1px;right:1px;bottom:1px;height:20px;border-radius:0 0 13px 13px;
  background:linear-gradient(180deg,rgba(251,245,230,0),rgba(251,245,230,.92));
  pointer-events:none;z-index:4
}
.tlbody{
  position:relative;
  background:
    linear-gradient(0deg,rgba(79,32,40,.10) 1px,transparent 1px) 38px 0/calc(100% - 38px) 40px,
    linear-gradient(0deg,rgba(79,32,40,.05) 1px,transparent 1px) 38px 0/calc(100% - 38px) 20px
}
.tlbody::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:1px;background:rgba(79,32,40,.16);z-index:1}
.tick{
  position:absolute;left:0;width:31px;text-align:right;font-size:9.5px;font-weight:700;
  color:var(--ink2);opacity:.9;transform:translateY(-6px);padding-right:3px;font-variant-numeric:tabular-nums
}
/* 每一块：时间固定在最左一列，任务名从同一条竖线起排 */
.blk{
  position:absolute;left:41px;right:7px;border-radius:9px;
  padding:3px 9px 3px 6px;overflow:hidden;
  color:var(--ink);box-shadow:inset 0 0 0 1.3px rgba(79,32,40,.2);z-index:2;
  display:flex;align-items:center;gap:8px
}
.blk.tall{align-items:flex-start;padding-top:5px}
.blk .bt{
  flex:none;width:53px;text-align:left;font-size:9.5px;font-weight:800;
  color:rgba(79,32,40,.66);font-variant-numeric:tabular-nums;letter-spacing:-.35px;
  line-height:1.15;white-space:nowrap
}
.blk .bn{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;justify-content:center}
.blk .nm{
  font-size:12px;font-weight:800;line-height:1.16;letter-spacing:-.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.blk .s{
  font-size:9px;font-weight:600;color:rgba(79,32,40,.58);line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.blk.course{background:#FED0D6}
.blk.task{background:#E4F6A9}
.blk.ielts{background:#BDDE93}
.blk.prep{background:#FF82A2;color:#4F2028}
.blk.prep .bt,.blk.prep .s{color:rgba(79,32,40,.74)}
.blk.meeting{background:#DBE2C5}
.blk.move{background:#DBE2C5}
.blk.added{box-shadow:inset 0 0 0 2px var(--hotd)}
.blk.canceled{opacity:.5;text-decoration:line-through}
.tl-note{
  display:flex;align-items:center;gap:7px;font-size:9.5px;line-height:1.6;color:var(--ink2);
  margin-top:10px;padding:8px 10px;background:var(--lime);border-radius:10px;color:#3A4A12
}
.tl-note b{font-weight:800}

/* ══════════ 飞书卡 ══════════ */
.fs{
  background:#fff;border-radius:14px 14px 12px 12px;overflow:hidden;margin-bottom:10px;
  box-shadow:0 2px 0 rgba(74,34,51,.08),0 12px 20px -18px rgba(74,34,51,.7);
  border:1.4px solid rgba(74,34,51,.08)
}
.fs-h{display:flex;align-items:center;gap:8px;padding:9px 11px;background:#F4F6FB;border-bottom:1px solid #E6EAF3}
.fs-logo{
  width:22px;height:22px;border-radius:6px;background:linear-gradient(150deg,#3D7BF7,#2B4ED6);
  color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none
}
.fs-h .nm{line-height:1.3}
.fs-h .nm b{display:block;font-size:11px;font-weight:800;color:#1F2937}
.fs-h .nm span{font-size:9px;color:#7A879E}
.fs-h .tm{margin-left:auto;font-size:9px;color:#98A3B8}
.fs-q{padding:10px 11px 9px;font-size:11.5px;line-height:1.72;color:#28303F}
.fs-q b{font-weight:800;background:#E4F6A9;padding:0 2px;border-radius:3px}
.fs-tags{display:flex;gap:6px;padding:0 11px 10px;flex-wrap:wrap}
.fs-tags span{font-size:8.5px;font-weight:800;padding:3px 7px;border-radius:20px;background:#EEF1F7;color:#5B6880}
.fs-tags span.warn{background:#FFE3E8;color:#B31E43}

/* ══════════ 落点选项 ══════════ */
.opt{
  display:flex;gap:9px;padding:11px;border-radius:13px;cursor:pointer;margin-bottom:8px;
  background:var(--paper);box-shadow:inset 0 0 0 1.6px rgba(79,32,40,.28);box-shadow:inset 0 0 0 1.6px rgba(79,32,40,.28),0 1.5px 0 rgba(79,32,40,.10);transition:.14s;position:relative
}
.opt:hover{box-shadow:inset 0 0 0 1.8px rgba(79,32,40,.5),0 2px 0 rgba(79,32,40,.12);background:var(--paper)}
.opt .kd{
  width:22px;height:22px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;background:var(--pink);color:#7A2E42;margin-top:1px;
  box-shadow:inset 0 0 0 1.4px rgba(79,32,40,.16)
}
.opt .ob{flex:1;min-width:0}
.opt .on1{font-size:15px;font-weight:800;line-height:1.4;display:flex;align-items:center;gap:6px}
.opt .on1 em{font-style:normal;font-size:8.5px;font-weight:800;background:var(--lime);color:#3A4A12;padding:1.5px 6px;border-radius:20px}
.opt .on2{font-size:11px;color:var(--ink2);margin-top:3px}
.opt .cost{font-size:10px;line-height:1.6;color:var(--ink2);margin-top:6px;padding-top:6px;border-top:1px dashed rgba(79,32,40,.16)}
.opt.on{background:var(--pink);box-shadow:inset 0 0 0 2.2px var(--hotd)}
.opt.on .kd{background:var(--hotd);color:#fff;box-shadow:none}
.opt.on .on2,.opt.on .cost{color:var(--ink2)}
.opt.on::before{
  content:"✓";position:absolute;right:11px;top:11px;width:18px;height:18px;border-radius:50%;
  background:var(--hotd);color:#fff;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center
}

/* ══════════ 整周横滑 ══════════ */
.wkbar{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:9px}
.wkbar::-webkit-scrollbar{display:none}
.wkbar .wd{
  flex:none;font-size:9.5px;font-weight:700;color:var(--ink2);padding:4px 8px;border-radius:20px;min-width:30px;text-align:center;
  background:rgba(251,245,230,.8);box-shadow:inset 0 0 0 1.2px rgba(74,34,51,.14);cursor:pointer;position:relative
}
.wkbar .wd.on{background:var(--ink);color:#FBF5E6;box-shadow:none}
.wkbar .wd i{position:absolute;top:1px;right:2px;width:4px;height:4px;border-radius:50%;background:var(--hot);display:block}
.wkbar .wd i.g{background:var(--sage)}
.wksc{
  display:flex;gap:9px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  padding-bottom:4px;margin:0 -14px;padding-left:14px;padding-right:14px;align-items:stretch
}
.wksc::-webkit-scrollbar{display:none}
.wday{
  flex:none;width:calc(100% - 22px);scroll-snap-align:start;background:var(--card);border-radius:14px;min-height:430px;
  padding:11px 11px 9px;box-shadow:0 2px 0 rgba(74,34,51,.08),0 10px 18px -18px rgba(74,34,51,.7);
  border:1.4px solid rgba(74,34,51,.07)
}
.wday .wh{display:flex;align-items:baseline;gap:7px;padding-bottom:8px;border-bottom:1.5px dashed rgba(74,34,51,.13)}
.wday .wh b{font-size:13px;font-weight:800}
.wday .wh span{font-size:9px;color:var(--ink3)}
.wday .wh em{font-style:normal;margin-left:auto;font-size:8.5px;font-weight:800;color:var(--hotd);background:#FFE3E8;padding:2px 6px;border-radius:20px}
.wde{display:flex;gap:7px;padding:5px 0;border-bottom:1px solid rgba(74,34,51,.055);font-size:9.5px;align-items:baseline}
.wde:last-child{border-bottom:none}
.wde .wt{width:62px;flex:none;font-size:8.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.wde .wn{flex:1;font-weight:700;line-height:1.42}
.wde .wn em{font-style:normal;font-size:7.5px;font-weight:800;padding:1px 4px;border-radius:3px;margin-left:4px;vertical-align:1px}
.wde .wn em.a{background:var(--hot);color:#fff}
.wde .wn em.c{background:rgba(74,34,51,.12);color:var(--ink3)}
.wde .wp{font-size:8px;color:var(--ink3);flex:none;max-width:80px;text-align:right;line-height:1.35}
.wde.canceled{opacity:.45}
.wde.canceled .wn{text-decoration:line-through}
.wday .foot{font-size:9px;line-height:1.6;color:var(--ink2);margin-top:7px;padding-top:7px;border-top:1.5px dashed rgba(74,34,51,.13)}
.wday .foot b{font-weight:800;color:var(--ink)}

/* ══════════ 输入框 / 底栏 ══════════ */
.composer{flex:none;padding:7px 12px 4px;border-top:1.5px dashed rgba(74,34,51,.14);background:rgba(251,245,230,.9)}
.chint{display:flex;align-items:center;gap:6px;font-size:9px;color:var(--ink3);padding:0 2px 5px}
.chint .c{flex:none;width:14px;height:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--ink3)}
.chint .c img,.chint .c svg{width:14px;height:14px;display:block;object-fit:contain}
.crow{display:flex;gap:7px;align-items:center}
.crow input{
  flex:1;font-family:inherit;font-size:12px;color:var(--ink);background:var(--card);
  border:0;border-radius:20px;padding:9px 13px;outline:none;
  box-shadow:inset 0 0 0 1.4px rgba(74,34,51,.12)
}
.crow input::placeholder{color:var(--ink3)}
.crow input:focus{box-shadow:inset 0 0 0 1.6px rgba(74,34,51,.3)}
.send{
  width:32px;height:32px;border-radius:50%;border:0;background:var(--ink);color:var(--lime);
  font-size:14px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;font-family:inherit
}
.send:active{transform:scale(.94)}
.tabbar{flex:none;height:50px;display:flex;align-items:center;justify-content:space-around;padding:0 6px 2px;border-top:1.5px solid rgba(74,34,51,.09);background:rgba(251,245,230,.96)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:8.5px;color:var(--ink3);cursor:pointer;padding:3px 10px;border-radius:9px;transition:.14s}
.tab svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink);font-weight:800}
.tab:hover{background:rgba(74,34,51,.05)}

/* ══════════ 右栏注释 ══════════ */
.notes{height:min(844px,calc(100vh - 48px));display:flex;flex-direction:column;gap:0;padding-left:4px}
.nhead{font-size:10px;letter-spacing:.18em;color:var(--ink3);font-weight:700;display:flex;align-items:center;gap:7px}
.nhead b{color:var(--ink);font-size:11px;letter-spacing:0}
.ncard{
  margin-top:14px;background:rgba(251,245,230,.8);border-radius:14px;padding:13px 14px;
  box-shadow:inset 0 0 0 1.3px rgba(74,34,51,.09)
}
.ncard .nt{font-size:11.5px;font-weight:800;line-height:1.5;display:flex;align-items:center;gap:6px}
.ncard .nt i{width:6px;height:6px;border-radius:50%;background:var(--hot);display:block;flex:none}
.ncard p{font-size:10.5px;line-height:1.82;color:var(--ink2);margin-top:7px}
.ncard p b{color:var(--ink);font-weight:800}
.nlist{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.nlist .ni{display:flex;gap:8px;font-size:10px;line-height:1.7;color:var(--ink2);align-items:flex-start}
.nlist .ni i{
  width:15px;height:15px;border-radius:50%;flex:none;background:var(--lime);color:#3A4A12;
  font-style:normal;font-size:8.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px
}
.nlist .ni b{color:var(--ink);font-weight:800}
.nspacer{flex:1;display:flex;align-items:flex-end;justify-content:flex-end;padding:8px 2px 2px 0}
.nspacer img{opacity:.94}
.nfoot{font-size:9px;color:var(--ink3);line-height:1.7;padding-top:10px;border-top:1px dashed rgba(74,34,51,.16)}
.nfoot b{color:var(--ink2)}

@media (max-width:1120px){
  .app{grid-template-columns:1fr;padding:0;height:100vh}
  .rail,.notes{display:none}
  .stagewrap{height:100vh;width:100vw}
  .fit{transform:none!important;width:100vw!important;height:100vh!important}
  .phone{width:100vw;height:100vh;border-radius:0;padding:0;box-shadow:none;background:var(--paper)}
  .phone::before{display:none}
  .screenbox{border-radius:0;height:100%}
  .statusbar{padding-top:6px;height:36px}
  .composer{padding-bottom:8px}
  .tabbar{height:56px;padding-bottom:8px}
  .toast{bottom:150px}
}

/* toast */
.toast{
  position:absolute;left:50%;bottom:132px;transform:translate(-50%,10px);
  background:var(--ink);color:#FBF5E6;font-size:10.5px;font-weight:700;
  padding:8px 14px;border-radius:20px;opacity:0;pointer-events:none;transition:.24s;z-index:20;white-space:nowrap
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.catimg{display:block;object-fit:contain;-webkit-user-drag:none;user-select:none}
.screendecor{display:flex;justify-content:flex-end;margin-top:16px;opacity:.92;pointer-events:none}
.stickyfoot{display:flex;gap:7px;margin-top:14px;padding:0}
/* ══════════ v3：纯色头像 / 大字焦点 / 彩色任务块 / 猫贴边 ══════════ */

/* 1. 头像：纯色块，不做图形 */
.topbar .avatar{
  width:34px;height:34px;border-radius:11px;background:var(--ink);
  font-size:0;color:transparent;box-shadow:none;flex:none;overflow:hidden
}
.msg .av{
  width:28px;height:28px;border-radius:9px;background:var(--ink);
  flex:none;margin-top:3px;overflow:hidden;box-shadow:0 2px 0 rgba(74,34,51,.12)
}
.msg .av svg,.msg .av img{display:none}
.chint{font-size:10px;gap:7px}
.chint .c{width:10px;height:10px;border-radius:3px;background:var(--ink);display:block}
.chint .c svg{display:none}

/* 2. 字号抬起来：去掉一层小字 */
.bub{font-size:13px;line-height:1.72}
.stamp{font-size:10px}
.card-h b{font-size:14.5px}
.card-h span{font-size:10px}
.row .t b{font-size:13px}
.row .t span{font-size:10.5px}
.row .n{width:21px;height:21px;font-size:10px}
.cnt{font-size:10.5px}
.cnt b{font-size:17px;letter-spacing:-.4px}
.receipt{font-size:10.5px}
.btn.sm{font-size:11.5px;min-height:36px;padding:0 13px}
.opt .on1{font-size:15px;letter-spacing:-.2px}
.opt .on2{font-size:10.5px}
.opt .cost{font-size:10px}
.opt .kd{width:22px;height:22px;font-size:11px;border-radius:8px}
.chips .ch{font-size:10px;padding:4.5px 9px}

/* 3. 大数字：一屏一个焦点 —— 轻量圆片标签，不堆硬卡片 */
.tally{display:flex;gap:9px;align-items:flex-end;position:relative;padding-top:6px}
.tg{
  flex:1;border-radius:16px;padding:12px 10px 10px;text-align:center;position:relative;
  box-shadow:inset 0 0 0 1.6px rgba(79,32,40,.18),0 3px 0 rgba(79,32,40,.08)
}
.tg .num{display:block;font-size:30px;line-height:.9;font-weight:800;letter-spacing:-1.4px}
.tg>span{display:block;font-size:10px;font-weight:700;color:var(--ink2);margin-top:7px;white-space:nowrap}
.tg.pink{background:var(--pink)}
.tg.lime{background:var(--lime)}
.tg.lime .num{color:#33420F}
.tg.sage{background:var(--sage)}
.tg.sage .num{color:#2F4118}

/* 4. 信息条 */
.infobar{
  position:relative;display:flex;align-items:center;gap:9px;
  background:var(--lime);color:#33420F;border-radius:13px;padding:11px 12px;
  font-size:12px;font-weight:700;line-height:1.55;
  box-shadow:0 2.5px 0 rgba(74,34,51,.10)
}
.infobar b{font-weight:800}
/* 空档提示条：表里不写午饭晚饭午觉，只在这里提醒一次 */
.mealbar{
  position:relative;background:var(--pink);color:#5E2130;border-radius:14px;
  padding:10px 11px 11px;margin-top:44px;
  box-shadow:inset 0 0 0 1.7px rgba(79,32,40,.22),0 2.5px 0 rgba(79,32,40,.14)
}
.mealbar .mh{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--hotd)}
.mealbar .mh i{width:14px;height:14px;border-radius:50%;background:var(--hotd);color:#fff;font-style:normal;
  font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.mealbar .mt{font-size:12.5px;font-weight:700;line-height:1.6;margin-top:5px}
.mealbar .mt b{font-weight:800;color:var(--hotd)}
.mealbar .mt .tm{font-variant-numeric:tabular-nums;font-weight:800;color:var(--hotd)}
.mealbar .mb{display:flex;gap:7px;margin-top:9px}
.mealbar .btn{min-height:38px;font-size:11.5px}
/* 结论卡：一行「为什么」，一行状态，一个大数字 */
.res-why{
  font-size:10px;font-weight:600;line-height:1.45;color:rgba(79,32,40,.58);
  padding-bottom:7px;margin-bottom:7px;border-bottom:1px dashed rgba(79,32,40,.16)
}
.res-why b{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.res-lb{font-size:10.5px;font-weight:700;color:var(--ink2)}
.res-num{
  font-size:23px;font-weight:800;letter-spacing:-1.1px;line-height:1.06;margin-top:1px;
  font-variant-numeric:tabular-nums
}

/* ══ 要求确认卡：助手复述要改哪几件事，每条自带「确认 / 改一下」 ══ */
.recap{
  padding:11px 11px 12px;background:var(--ai);
  border:1.7px solid rgba(79,32,40,.24);
  box-shadow:0 3px 0 rgba(79,32,40,.13),0 22px 34px -24px rgba(79,32,40,.6)
}
.recap.done{background:var(--lime)}
.rc-h{display:flex;align-items:baseline;gap:7px;padding:1px 2px 0}
.rc-h b{font-size:12.5px;font-weight:800;letter-spacing:-.1px}
.rc-h em{font-style:normal;margin-left:auto;font-size:9.5px;font-weight:800;color:rgba(79,32,40,.52);white-space:nowrap}

.rc-item{
  background:var(--paper);border-radius:12px;padding:10px 10px;
  box-shadow:inset 0 0 0 1.4px rgba(79,32,40,.2);margin-top:8px;transition:.16s
}
.rc-item.on{background:var(--sage);box-shadow:inset 0 0 0 1.6px rgba(79,32,40,.26)}
.rc-item.editing{box-shadow:inset 0 0 0 2px var(--hotd)}
.rc-top{display:flex;align-items:baseline;gap:8px;padding:1px 1px 0}
.rc-n{
  flex:1;min-width:0;font-size:13px;font-weight:800;letter-spacing:-.2px;
  line-height:1.22;white-space:normal
}
.rc-sub{
  font-size:10px;font-weight:600;line-height:1.45;
  color:rgba(79,32,40,.55);margin-top:3px;padding-left:1px
}
.rc-item.on .rc-sub{color:rgba(47,65,24,.6)}
.rc-n i{
  font-style:normal;font-size:8.5px;font-weight:800;color:var(--saged);
  background:var(--sage);border-radius:20px;padding:1.5px 5px;margin-left:5px;vertical-align:1px
}
.rc-at{
  flex:none;font-size:10.5px;font-weight:800;color:rgba(79,32,40,.58);
  font-variant-numeric:tabular-nums;white-space:nowrap
}
.rc-btns{display:flex;gap:7px;margin-top:9px}
.rcb{
  border:0;cursor:pointer;font-family:inherit;min-height:42px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:12.5px;font-weight:800;letter-spacing:-.1px;padding:0 8px;transition:.1s
}
.rcb.ok{flex:1.35;background:var(--lime);color:#33420F;box-shadow:0 2px 0 #94A94A}
.rcb.ok:active{transform:translateY(2px);box-shadow:0 .5px 0 #94A94A}
.rcb.edit{flex:1;background:transparent;color:var(--ink2);box-shadow:inset 0 0 0 1.5px rgba(79,32,40,.3)}
.rcb.edit:active{background:rgba(79,32,40,.07)}
.rc-item.on .rcb.ok{background:var(--saged);color:#F2F8E2;box-shadow:0 2px 0 #3A4E24}
.rc-item.on .rcb.ok:active{transform:translateY(2px);box-shadow:0 .5px 0 #3A4E24}
.rc-item.on .rcb.edit{color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(79,32,40,.38)}
.rc-in{
  font:inherit;font-size:13px;font-weight:800;color:var(--ink);width:100%;
  background:var(--paper);border:none;border-radius:9px;padding:10px 11px;
  box-shadow:inset 0 0 0 1.9px var(--hotd);outline:none
}
.rc-tip{font-size:9.5px;font-weight:700;color:rgba(79,32,40,.55);margin-top:7px;padding-left:1px}
.rc-ok{width:100%;justify-content:center;margin-top:10px;min-height:44px;font-size:12.5px}
.rc-ok[disabled]{
  background:transparent;color:rgba(79,32,40,.42);box-shadow:inset 0 0 0 1.5px rgba(79,32,40,.2)
}
.rc-done{display:flex;align-items:center;gap:8px;padding:2px 2px}
.rc-done .ok{
  width:16px;height:16px;border-radius:50%;background:#2F4118;color:var(--lime);
  display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;flex:none
}
.rc-done b{font-size:12px;font-weight:800;letter-spacing:-.1px}
.rc-done .rc-again{
  margin-left:auto;font-size:9.5px;font-weight:800;color:rgba(79,32,40,.55);
  text-decoration:underline;text-underline-offset:2px;cursor:pointer;white-space:nowrap
}
.infobar.soft{background:var(--card);color:var(--ink2);box-shadow:inset 0 0 0 1.4px rgba(74,34,51,.1)}
.infobar.pink{background:var(--pink);color:#7A2E42}

/* 5. 猫：站在条子边沿上 */
.caton{
  position:absolute;bottom:calc(100% - 3px);z-index:6;pointer-events:none;
  animation:catIdle 4.8s ease-in-out infinite;transform-origin:50% 90%
}
.caton img{display:block;filter:drop-shadow(0 3px 2px rgba(74,34,51,.18))}
.catnap{position:absolute;right:11px;z-index:3;pointer-events:none;animation:catBreathe 4.6s ease-in-out infinite;transform-origin:50% 100%}
.catnap img{display:block;opacity:.94}
.railfoot .cat img{animation:catIdle 5.4s ease-in-out infinite;transform-origin:50% 92%}
.nspacer img{animation:catBreathe 5.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes catIdle{0%,100%{transform:translateY(0) rotate(-1.8deg)}45%{transform:translateY(-3px) rotate(1.8deg)}}
@keyframes catBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045,.96)}}
@keyframes catHop{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}
.card:hover .caton{animation:catHop .55s ease-out}
@media (prefers-reduced-motion:reduce){.caton,.catnap,.railfoot .cat img,.nspacer img{animation:none}}

/* 6. 整周详细：整日计划，事件按类型上色，空档统一标「休息」 */
.wde{
  display:flex;gap:8px;align-items:center;padding:0;margin:0 0 3px;border:none;
  border-radius:9px;overflow:hidden;
  box-shadow:inset 0 0 0 1.2px rgba(79,32,40,.14)
}
.wde .wt{
  flex:none;width:59px;padding:4px 0 4px 7px;font-size:9px;font-weight:800;
  line-height:1.35;color:rgba(79,32,40,.62);font-variant-numeric:tabular-nums;letter-spacing:-.25px;
  white-space:nowrap
}
.wde .wn{flex:1;min-width:0;padding:4px 8px 4px 0;font-size:11.5px;font-weight:800;line-height:1.3}
.wde .wn .wp{display:block;font-size:9px;font-weight:600;color:rgba(79,32,40,.55);margin-top:1px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wde .wn .wpi{font-size:9px;font-weight:700;color:rgba(79,32,40,.44);margin-left:5px;letter-spacing:0}
.wde .wn em{
  font-style:normal;font-size:8.5px;font-weight:800;padding:1px 5px;border-radius:20px;
  background:var(--paper);color:#3A4A12;margin-left:4px;vertical-align:1px;white-space:nowrap
}
.wde.k-course{background:#FED0D6}
.wde.k-task{background:#E4F6A9}
.wde.k-ielts{background:#BDDE93}
.wde.k-prep{background:#FF82A2;color:#4F2028}
.wde.k-prep .wp,.wde.k-prep .wt{color:rgba(79,32,40,.74)}
.wde.k-meeting{background:#DBE2C5}
.wde.k-move{background:#DBE2C5}
/* 休息：不着色，虚线框，一眼看出是空档而不是日程 */
.wde.k-rest{
  background:transparent;box-shadow:none;
  border:1.3px dashed rgba(79,32,40,.26);border-radius:8px
}
.wde.k-rest .wt{color:rgba(79,32,40,.42);font-weight:700}
.wde.k-rest .wn{color:rgba(79,32,40,.5);font-weight:700;font-size:11px}
.wde.canceled{opacity:.42}
.wde.canceled .wn{text-decoration:line-through;text-decoration-thickness:1.5px}

.legend{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 8px}
.legend span{display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;color:var(--ink2)}
.legend i{width:9px;height:9px;border-radius:3px;display:block}
.legend i.rest{border:1.2px dashed rgba(79,32,40,.45);background:transparent}

.wday{min-height:0;padding:11px 10px 10px;position:relative}
.wday .wh b{font-size:16px;letter-spacing:-.2px}
.wday .wh span{font-size:10px;font-weight:700}
.wday .wh em{font-size:9.5px;padding:2.5px 7px}
.wday .foot{font-size:10px;line-height:1.55;margin-top:8px;padding-top:8px;color:var(--ink2)}

/* 7. 日视图 */
.weekhead{align-items:center;gap:7px;margin:2px 0 10px}
.weekhead b{font-size:22px;letter-spacing:-.6px}
.weekhead .wkdt{font-style:normal;font-size:12px;font-weight:700;color:var(--ink3)}
.weekhead .wkflag{font-style:normal;font-size:9.5px;font-weight:800;color:#33420F;background:var(--lime);padding:3px 8px;border-radius:20px}
.weekhead span{font-size:10px;font-weight:700;color:var(--ink3);margin-left:auto}
.dchip{min-width:40px;padding:7px 5px 6px;border-radius:11px}
.dchip .d1{font-size:11px}
.dchip .d2{font-size:9px}
.tl-note{font-size:11px;padding:9px 11px;border-radius:11px}
.blk{font-size:10.5px}
.blk .s{font-size:8.5px}

/* 8. 撞课条块 */
.blkchip{padding:9px 9px;border-radius:10px;font-size:10px;font-weight:700;line-height:1.4}
.blkchip b{font-size:12px;font-weight:800}

</style>
</head>

/* 情绪词 / 用途名 -> 16 只里的某一只；也可以直接写猫名 */
const CAT_ALIAS = {
  smile:'wave',  idle:'sit',   think:'tilthead', sleep:'sleep',
  wow:'reach',   tired:'loaf', shy:'shy',        wait:'doze',
  busy:'yarn',   hug:'hug',    sing:'sing',      box:'box',
  smoke:'smoke', stretch:'stretch', heart:'heart', wave2:'wave2'
};

function catKey(k){ return CATP[k] ? k : (CAT_ALIAS[k] || 'wave'); }

/* size <= 40 用头部特写，否则用全身 */
function cat(k, size, cls){
  const n = catKey(k);
  const small = size <= 40;
  const src = small ? CATHEAD[n] : CATP[n];
  return `<img class="catimg ${cls||''}" src="${src}" alt="" aria-hidden="true" draggable="false"
    style="width:${Math.round(size)}px;height:${Math.round(size)}px" data-cat="${n}">`;
}

function liveEvs(d){ return d.evs.filter(e=>e[5]!=='canceled').slice().sort((a,b)=>a[0]-b[0]); }
function freeGaps(d, from, to){
  const out=[]; let cur=from;
  for(const e of liveEvs(d)){
    if(e[1]<=cur) continue;
    if(e[0]>cur) out.push([cur, Math.min(e[0],to)]);
    cur=Math.max(cur,e[1]);
    if(cur>=to) break;
  }
  if(cur<to) out.push([cur,to]);
  return out.filter(g=>g[1]>g[0]);
}
/* 午/晚饭要 30 分钟、午觉要 45 分钟；按半小时候选位逐格试坐 */
const MEALS=[
  {k:'午饭', a:11.5, b:13.5, need:0.5},
  {k:'晚饭', a:17,   b:19.5, need:0.5},
  {k:'午觉', a:12,   b:14.5, need:0.75}
];
function slotFree(d, t, need){
  return !liveEvs(d).some(e=>e[0] < t+need-1e-6 && e[1] > t+1e-6);
}
function mealShort(d){
  return MEALS.filter(m=>{
    for(let t=m.a; t+m.need <= m.b+1e-6; t+=0.5) if(slotFree(d,t,m.need)) return false;
    return true;
  });
}
function dur(h){
  const m=Math.round(h*60);
  const hh=Math.floor(m/60), mm=m%60;
  if(!hh) return `${mm} 分钟`;
  return mm?`${hh} 小时 ${mm} 分`:`${hh} 小时`;
}

/* 空档里睡一只猫 */
function tlCat(d, h0, pxh){
  const evs = d.evs.slice().sort((a,b)=>a[0]-b[0]);
  let best = null, cur = h0;
  for(const e of evs){
    if(!best || (e[0]-cur) > best.g) best = {s:cur, g:e[0]-cur};
    cur = Math.max(cur, e[1]);
  }
  if(!best || (H1-cur) > best.g) best = {s:cur, g:H1-cur};
  if(!best || best.g < 1.35) return '';
  const h = best.g * pxh;
  if(h < 52) return '';
  const top = (best.s - h0) * pxh + (h - 34) / 2;
  return `<span class="catnap" style="top:${Math.round(top)}px">${cat('sleep',34)}</span>`;
}

function timeline(d){
  const evs = d.evs.slice().sort((a,b)=>a[0]-b[0]);
  const first = evs.length ? evs[0][0] : H0;
  const h0 = Math.max(6, Math.floor(first*2)/2 - 0.5);   /* 当天第一件事前半小时起 */
  const pxh = 40;                                        /* 半小时 20px */
  const ticks=[];
  for(let h=Math.ceil(h0); h<=H1; h+=1) {
    const big = h%2===0;
    ticks.push(`<div class="tick" style="top:${(h-h0)*pxh}px;${big?'':'opacity:.55;font-size:8.5px'}">${String(h).padStart(2,'0')}</div>`);
  }
  const blocks = evs.map(e=>{
    const [s,en,t,sub,kind,extra]=e;
    const h=(en-s)*pxh-3;
    const tm = `${hhmm(s)}–${hhmm(en)}`;
    /* 时间永远在最左一列，任务名从同一条竖线上起排 */
    const tall = h>=52;
    const inner=`<span class="bt">${tm}</span><span class="bn"><span class="nm">${t}</span>${(tall&&sub)?`<span class="s">${sub}</span>`:''}</span>`;
    return `<div class="blk ${kind} ${extra||''} ${tall?'tall':''}" style="top:${(s-h0)*pxh}px;height:${Math.max(h,26)}px">${inner}</div>`;
  }).join('');
  const bodyH = Math.ceil((Math.min(H1, Math.max(h0+8, ...evs.map(e=>e[1]+.5)))-h0)*pxh);
  const tlh = bodyH;                          /* 整天一条，不再内嵌小滚动条 */
  return `<div class="tlwrap"><div class="tl" id="tl" style="height:${tlh}px"><div class="tlbody" style="height:${bodyH}px">${ticks.join('')}${tlCat(d,h0,pxh)}${blocks}</div></div></div>`;
}

function mealWhy(d, miss){

  const inside = liveEvs(d).filter(e=>e[1]>m.a && e[0]<m.b);
  if(!inside.length) return `<b>${label}塞不进去</b>。`;
  if(inside.length===1)
    return `<span class="tm">${hhmm(Math.max(inside[0][0],m.a))}–${hhmm(inside[0][1])}</span> 整段在「${inside[0][2]}」上 —— <b>${label}塞不进去</b>。`;
  const first = inside[0], last = inside[inside.length-1];
  if(last[0]-first[1] < .17)
    return `${first[2]} <span class="tm">${hhmm(first[1])}</span> 一收，${last[2]}就接上 —— <b>一分钟没留，${label}塞不进去</b>。`;

}

/* 整日计划：事件 + 中间的休息，8:00–22:00 补满（首末按真实情况外扩） */
function weekRows(d){
  const evs = d.evs.filter(e=>e[5]!=='canceled').slice().sort((a,b)=>a[0]-b[0]);
  const first = evs.length?evs[0][0]:8;
  const last  = evs.length?Math.max(...evs.map(e=>e[1])):22;
  const from = Math.min(8, first), to = Math.max(22, last);
  const out=[]; let cur=from;
  for(const e of evs){
    if(e[0]-cur >= REST_GAP) out.push({rest:true, s:cur, en:e[0]});
    out.push({ev:e});
    cur = Math.max(cur, e[1]);
  }
  if(to-cur >= REST_GAP) out.push({rest:true, s:cur, en:to});
  return out;
}

function go(n){
  if(n<0||n>5) return;
  S.beat = n;
  if(n===5) S.dayIdx = S.reverted?3:3;
  render();
}
function toast(t){
  const el2=$('toast'); el2.textContent=t; el2.classList.add('on');
  clearTimeout(S.toastT); S.toastT=setTimeout(()=>el2.classList.remove('on'),1900);
}

document.addEventListener('click', e=>{
  // 左栏 / 回执跳转
  const j = e.target.closest('[data-jump]');
  if(j){ go(+j.dataset.jump); return; }

  // 拍内跳转
  const g = e.target.closest('[data-go]');
  if(g){ go(+g.dataset.go); return; }

  // 采纳条目
  const it = e.target.closest('[data-item]');
  if(it && !e.target.closest('[data-alt]')){
    const i=+it.dataset.item; S.adopt[i]=!S.adopt[i]; render(); return;
  }
  // 自定义时间
  const alt = e.target.closest('[data-alt]');
  if(alt){
    const [i,a]=alt.dataset.alt.split('|');
    S.custom[+i]=a; render(); return;
  }
  // 落点
  const opt = e.target.closest('[data-opt]');
  if(opt){ S.pick=opt.dataset.opt; render(); return; }

  // 日期条
  const day = e.target.closest('[data-day]');
  if(day){ S.dayIdx=+day.dataset.day; render(); return; }
  const wk = e.target.closest('[data-wk]');
  if(wk){
    const i=+wk.dataset.wk; S.dayIdx=i;
    const sc=document.getElementById('wksc');
    if(sc){ const c=sc.querySelectorAll('.wday')[i]; if(c) sc.scrollTo({left:c.offsetLeft-14,behavior:'smooth'}); }
    document.querySelectorAll('.wkbar .wd').forEach((x,k)=>x.classList.toggle('on',k===i));
    return;
  }

  // 主动作
  const a = e.target.closest('[data-act]');
  if(!a) return;
  const act = a.dataset.act;
  if(act==='rcrowok'){
    const i=+a.dataset.i; S.recap[i].ok=!S.recap[i].ok; render();
    const left=S.recap.filter(r=>!r.ok).length;
    toast(left?`还剩 ${left} 条没确认`:'三条都对上了，往下算吧');
    return;
  }
  if(act==='rcfix'){ S.recapEdit=+a.dataset.i; S.recapOk=false; render(); return; }
  if(act==='rcsave'){
    const i=+a.dataset.i, box=$('rc-in'), v=(box?box.value:'').trim();
    if(!v){ toast('这条要求想改成什么？写一句再存'); return; }
    S.recap[i].n=v; S.recap[i].edited=true; S.recap[i].ok=true; S.recapEdit=-1;
    render(); toast('改好了 · 只动这一条要求，其余照旧'); return;
  }
  if(act==='rccancel'){ S.recapEdit=-1; render(); toast('好，这条按原来的'); return; }
  if(act==='rcok'){
    if(S.recap.some(r=>!r.ok)){ toast('还有没确认的条目'); return; }
    S.recapOk=true; S.recapEdit=-1; render(); toast('行，就按这几件算代价'); return;
  }
  if(act==='rcagain'){ S.recapOk=false; S.recap.forEach(r=>r.ok=false); S.recapEdit=-1; render(); return; }
  if(act==='self'){ S.selfEdit=true; render(); toast('逐条换时间，选完点「存下这一版」'); }
  if(act==='save'){
    S.selfEdit=false; S.customized=true;
    const n=S.custom.filter(Boolean).length;
    render(); toast(n?`已存下 ${n} 处自定义`:'已存下，按默认那版');
    setTimeout(()=>go(2),520);
  }
  if(act==='later'){ S.later=!S.later; render(); toast(S.later?'先搁着，表不动':'好，那我帮你找位置'); }
  if(act==='skip'){ S.skipWeek=!S.skipWeek; if(S.skipWeek)S.pick=null; render(); toast(S.skipWeek?'这周记 0 小时，下周补':'改回来了，挑个落点就能排'); }
  if(act==='pick'){
    toast(`已放到${({A:'周六 18:00',B:'周五 21:10',C:'下周一 10:00'})[S.pick]}，写进表了`);
    setTimeout(()=>go(5),420);
  }
  if(act==='undo'){
    S.reverted=!S.reverted;
    toast(S.reverted?'撤回了，表回到改课前':'恢复了，改课那一版又回来了');
    render();
  }
  if(act==='mealkeep'){
    S.keep[A[S.dayIdx].w]=true;
    render(); toast('留好了 · 不写进周计划');
  }
  if(act==='mealskip'){
    S.keep[A[S.dayIdx].w]=false;
    render(); toast('行，那我不动，你自己挤');
  }

  // 底栏 tab
  const tb = e.target.closest('[data-tab]');
  if(tb){
    const i=+tb.dataset.tab;
    if(i===0){ go(S.beat<=2?2:5); S.dayIdx=3; render(); }
    else if(i===3){ toast('已经在对话里'); }
    else toast('这一版只做对话与日程');
  }
});

// 发送
function sendMsg(){
  const inp=$('inp'); const v=inp.value.trim(); if(!v) return;
  inp.value='';
  S.extra.push(v);
  const scr=$('screen');
  const wrap=document.createElement('div');
  wrap.innerHTML=`<div class="msg me"><div class="bub me">${v.replace(/</g,'&lt;')}</div></div>
    <div class="msg">${av('idle')}<div class="bub">${reply(v)}</div></div>`;
  scr.appendChild(wrap);
  scr.scrollTop = 99999;
  toast('记下了');
}
function reply(v){
  if(/改|挪|换/.test(v)) return '这条我记下来了。表还没动——你说「就按这个改」，我才写。';
  if(/不|别|停/.test(v)) return '好，那我先不动。需要的时候点上面那版安排就行。';
  return '收到。我还是只读——要改表，得你点头。';
}
$('send').addEventListener('click', sendMsg);
$('inp').addEventListener('keydown', e=>{ if(e.key==='Enter') sendMsg(); });

/* 适配窗口 */
function fit(){
  if(innerWidth < 1121){ $('fit').style.transform=''; return; }
  const k = Math.min(1, (innerHeight-56)/844, (innerWidth-660)/390);
  const s = Math.max(.72, k);
  $('fit').style.transform = `scale(${s})`;
  $('fit').style.width = (390*s)+'px';
  $('fit').style.height = (844*s)+'px';
}
addEventListener('resize', fit);
addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight') go(Math.min(5,S.beat+1));
  if(e.key==='ArrowLeft')  go(Math.max(0,S.beat-1));
});

/* 启动 */
fit();
render();
</script>
